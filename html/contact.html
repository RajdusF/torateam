<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TORA - Tomáš Rajdus</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/contact.css" />
    <link rel="stylesheet" type="text/css" href="../css/moving_car.css" />
    <link rel="icon" href="../photos/favicon.png" type="image/x-icon" />
  </head>
  <body data-mode="both">
    <header>
      <a href="index.html">
        <img src="../photos/tora_logo.png" alt="Logo" class="logo" />
      </a>
      <div class="moving-car-wrapper">
        <a href="easter.html" id="moving-logo-link">
          <img src="../photos/siluety/final/javelin_car.png" alt="Logo" class="moving-logo" />
        </a>
        <img src="../photos/siluety/javelin.png" class="moving-javelin" />
      </div>

      <nav>
        <ul>
          <li><a href="index.html">Hlavní strana</a></li>
          <li><a href="racing.html">Závody</a></li>
          <li><a href="athletics.html">Atletika</a></li>
          <li><a href="contact.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="background-image"></div>
      <div class="contact-container">
        <div class="contact-photo">
          <img src="../photos/tomas_edited.jpg" alt="Kontakt" />
        </div>
        <div class="info">
          <div class="top-info">
            <p>Tomáš Rajdus</p>
            <p><a href="tel:+420603203261" class="phone-link">+420 603 203 261</a></p>
            <p class="click-to-copy" onclick="copyText(this, 'Email zkopírován!')">tomas.rajdus@volny.cz</p>
          </div>

          <div class="fb-sites-wrapper">
            <div class="fb-sites">
              <a href="https://www.facebook.com/tomas.rajdus.9">
                <p><img src="../photos/FB-icon_edited.png" /> Tomáš Rajdus</p>
              </a>
            </div>
            <div class="fb-sites">
              <a href="https://www.facebook.com/toraracing">
                <p><img src="../photos/FB-icon_edited.png" /> TORA Racing Team</p>
              </a>
            </div>
          </div>
        </div>
      </div>
      <div class="map">
        <iframe
          src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2575.7053215077963!2d18.37711207685188!3d49.791606234582446!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4713fc082c13613b%3A0xfa9d4105c3e7d2e4!2zU2xlcMOhIDUwOCwgNzM5IDM0IMWgZW5vdg!5e0!3m2!1scs!2scz!4v1692470797650!5m2!1scs!2scz"
          width="450"
          height="350"
          style="border: 0"
          allowfullscreen=""
          loading="lazy"
          referrerpolicy="no-referrer-when-downgrade"
        ></iframe>
      </div>

      <div id="toast"></div>

      <script>
        function copyText(element, message) {
          navigator.clipboard.writeText(element.textContent).then(() => {
            const toast = document.getElementById("toast")
            toast.textContent = message // nastavíme text podle kliknutí
            toast.classList.add("show")
            setTimeout(() => {
              toast.classList.remove("show")
            }, 2000) // zmizí po 2s
          })
        }
      </script>

      <div id="footer-placeholder" style="margin-top: 80px"></div>
      <script>
        fetch("footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-placeholder").innerHTML = data
          })
      </script>
      <script src="../js/carAnimation.js"></script>
      <script src="../js/backgroundSelector.js"></script>
    </main>
  </body>
</html>
