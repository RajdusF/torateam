<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TORA - Tomáš Rajdus</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/contact.css" />
    <link rel="stylesheet" type="text/css" href="../css/moving_car.css" />
    <link rel="icon" href="../photos/favicon.png" type="image/x-icon" />
  </head>
  <body data-mode="both">
    <main>
      <div id="header-placeholder"></div>
      <div class="contact-container">
        <div class="contact-photo">
          <img src="../photos/tomas_edited.jpg" alt="Kontakt" />
        </div>
        <div class="info">
          <div class="top-info">
            <p>Tomáš Rajdus</p>
            <p><a href="tel:+420603203261" class="phone-link">+420 603 203 261</a></p>
            <p class="click-to-copy" onclick="copyText(this, 'Email zkopírován!')">tomas.rajdus@volny.cz</p>
          </div>

          <div class="second-info">
            <p>IČO:</p> <p class="click-to-copy" onclick="copyText(this, 'IČO zkopírováno!')">14608758</p><br>
            <p>DIČ:</p> <p class="click-to-copy" onclick="copyText(this, 'DIČ zkopírováno!')">CZ6303200365</p>
          </div>

          <div class="fb-sites-wrapper">
            <div class="fb-sites">
              <a href="https://www.facebook.com/tomas.rajdus.9">
                <p><img src="../photos/FB-icon_edited.png" /> Tomáš Rajdus</p>
              </a>
            </div>
            <div class="fb-sites">
              <a href="https://www.facebook.com/toraracing">
                <p><img src="../photos/FB-icon_edited.png" /> TORA Racing Team</p>
              </a>
            </div>
          </div>
        </div>
        <div class="map">
          <iframe
            src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2575.7053215077963!2d18.37711207685188!3d49.791606234582446!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4713fc082c13613b%3A0xfa9d4105c3e7d2e4!2zU2xlcMOhIDUwOCwgNzM5IDM0IMWgZW5vdg!5e0!3m2!1scs!2scz!4v1692470797650!5m2!1scs!2scz"
            style="border: 0"
            allowfullscreen=""
            loading="lazy"
            referrerpolicy="no-referrer-when-downgrade"
          ></iframe>
        </div>
      </div>

      <div id="toast"></div>

      <div class="contact-form">
        <div class="flow">
          <h1 data-i18n="contact_form">Kontaktní formulář</h1>
        </div>
        <form action="https://formsubmit.co/35b034d1f6bea0c5a6aefdf6532aa98d" method="POST">
          <input type="text" name="_honey" style="display: none" />
          <input type="hidden" name="_captcha" value="false" />
          <input type="hidden" name="_next" value="https://rajdusf.github.io/torateam/html/thankyou.html" />

          <div class="form-group">
            <label for="name" data-i18n="full_name">Celé jméno:*</label>
            <input type="text" id="name" name="Celé Jméno" required />
          </div>
          <div class="form-group">
            <label for="email" data-i18n="email">Email:*</label>
            <input type="email" id="email" name="E-mail" required />
          </div>
          <div class="form-group">
            <label for="phone" data-i18n="phone">Telefon:</label>
            <input type="tel" id="phone" name="Telefon" />
          </div>
          <div class="form-group">
            <label for="message" data-i18n="message">Zpráva:*</label>
            <textarea id="message" name="Zpráva" required></textarea>
          </div>

          <span data-i18n="required_fields">Položky označené hvězdičkou (*) jsou povinné.</span>

          <button data-i18n="submit_message">Odeslat zprávu</button>
        </form>
      </div>
    </main>
    <div id="footer-placeholder" style="margin-top: 80px"></div>
    <script>
      fetch("header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header-placeholder").innerHTML = html
        })
        .then(() => {
          if (typeof initCarAnimation === "function") {
            initCarAnimation()
          }
        })
        .then(() => {
          if (typeof initLanguage === "function") {
            initLanguage()
            console.log("Language initialized")
          }
        })
    </script>
    <script src="../js/language.js"></script>

    <script>
      function copyText(element, message) {
        navigator.clipboard.writeText(element.textContent).then(() => {
          const toast = document.getElementById("toast")
          toast.textContent = message // nastavíme text podle kliknutí
          toast.classList.add("show")
          setTimeout(() => {
            toast.classList.remove("show")
          }, 2000) // zmizí po 2s
        })
      }
    </script>

    <script src="../js/carAnimation.js"></script>

    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data
        })
    </script>
  </body>
</html>
