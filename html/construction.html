<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TORA - Tomáš Rajdus</title>
    <link rel="stylesheet" type="text/css" href="../css/slider.css" />
    <link rel="stylesheet" type="text/css" href="../css/index.css" />
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/moving_car.css" />
    <link rel="icon" href="../photos/favicon.png" type="image/x-icon" />
  </head>
  <body data-mode="both">
    <main>
      <div id="header-placeholder"></div>

      <p class="construction-text">Webové stránky jsou momentálně ve výstavbě.</p>

      <section class="about">
        <h1 data-i18n="about_title">TORA – RC modely aut</h1>
        <p data-i18n="about_text_0"></p>
        <p data-i18n="about_text_1"></p>
        <p data-i18n="about_text_2"></p>
      </section>

    </main>
    <div id="footer-placeholder"></div>

    <!-- SCRIPTS -->

    <script>
      fetch("header-construction.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header-placeholder").innerHTML = html
        })
        .then(() => {
          if (typeof initCarAnimation === "function") {
            initCarAnimation()
          }
        })
        .then(() => {
          if (typeof initLanguage === "function") {
            initLanguage()
            console.log("Language initialized")
          }
        })
    </script>


    <script src="../js/carAnimation.js"></script>
    <script src="../js/language.js"></script>
    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data
        })
    </script>
  </body>
</html>
