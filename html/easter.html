<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TORA - Tomáš Rajdus</title>
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/moving_car.css" />
    <link rel="icon" href="../photos/favicon.png" type="image/x-icon" />
  </head>
  <body data-mode="both">
    <header>
      <a href="index.html">
        <img src="../photos/tora_logo.png" alt="Logo" class="logo" />
      </a>
      <div class="moving-car-wrapper">
        <a href="easter.html" id="moving-logo-link">
          <img src="../photos/siluety/final/javelin_car.png" alt="Logo" class="moving-logo" />
        </a>
        <img src="../photos/siluety/javelin.png" class="moving-javelin" />
      </div>

      <nav>
        <ul>
          <li><a href="index.html">Hlavní strana</a></li>
          <li><a href="racing.html">Závody</a></li>
          <li><a href="athletics.html">Atletika</a></li>
          <li><a href="contact.html">Kontakt</a></li>
        </ul>
      </nav>
    </header>
    <main>
      <div class="platba">
        <p>2201858838/2010</p>
        <img src="../photos/ja.jpeg" alt="Logo" class="logo_easter" />
        <img src="../photos/platba.jpeg" alt="Logo" class="logo_easter" />
        <img src="../photos/atletika_flotila/3.jpg" alt="Logo" class="logo_easter" />
      </div>

      <script>
        const clip = document.querySelectorAll(".clip")
        for (let i = 0; i < clip.length; i++) {
          clip[i].addEventListener("mouseenter", function (e) {
            clip[i].play()
          })
          clip[i].addEventListener("mouseout", function (e) {
            clip[i].pause()
          })
        }
      </script>

      <script src="../js/carAnimation.js"></script>
    </main>
    <div id="footer-placeholder" style="margin-top: 700px">
      <script>
        fetch("footer.html")
          .then((response) => response.text())
          .then((data) => {
            document.getElementById("footer-placeholder").innerHTML = data
          })
      </script>
    </div>
  </body>
</html>
