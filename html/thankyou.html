<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>TORA - Tomáš Rajdus</title>
    <link rel="stylesheet" type="text/css" href="../css/slider.css" />
    <link rel="stylesheet" type="text/css" href="../css/index.css" />
    <link rel="stylesheet" type="text/css" href="../css/style.css" />
    <link rel="stylesheet" type="text/css" href="../css/moving_car.css" />
    <link rel="icon" href="../photos/favicon.png" type="image/x-icon" />
  </head>
  <body data-mode="both">
    <div id="header-placeholder"></div>
    <main>
      <div class="thankyou-container">
        <h1 data-i18n="thankyou_title">Děkujeme!</h1>
        <p data-i18n="thankyou_text">Vaše zpráva byla úspěšně odeslána! Brzy Vás budeme kontaktovat.</p>
      </div>
    </main>
    <div id="footer-placeholder"></div>
    <!-- SCRIPTS -->
    <script>
      fetch("header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header-placeholder").innerHTML = html
        })
        .then(() => {
          if (typeof initCarAnimation === "function") {
            initCarAnimation()
            console.log("Car animation initialized")
          }
        })
        .then(() => {
          if (typeof initLanguage === "function") {
            initLanguage()
            console.log("Language initialized")
          }
        })
    </script>
    <script src="../js/language.js"></script>
    <script src="../js/carAnimation.js"></script>
    <script>
      fetch("footer.html")
        .then((response) => response.text())
        .then((data) => {
          document.getElementById("footer-placeholder").innerHTML = data
        })
    </script>

    <script>
      fetch("header.html")
        .then((r) => r.text())
        .then((html) => {
          document.getElementById("header").innerHTML = html
        })
    </script>
  </body>
</html>
